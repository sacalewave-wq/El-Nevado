<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Distribuidora El Nevado</title>
    <link rel="stylesheet" href="recursos/main.css">
    <link rel="stylesheet" href="recursos/login.css">
</head>

<body class="login-page">

    <div class="login-container">
        <div class="login-card">

            <!-- Logo -->
            <div class="login-card__logo">
                <img src="recursos/logo.png" alt="El Nevado">
            </div>

            <!-- Título -->
            <h1 class="login-card__title">Iniciar Sesión</h1>
            <p class="login-card__subtitle">Ingrese sus credenciales autorizadas</p>

            <!-- Formulario -->
            <form class="login-form" action="inicio.html" method="GET">

                <!-- Usuario -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="usuario">Usuario o correo</label>
                        <span class="label-tag">Corporativo</span>
                    </div>
                    <div class="input-icon">
                        <input type="text" id="usuario" name="usuario" placeholder="ejemplo@elnevado.com o usuario"
                            required>
                        <span class="icon">👤</span>
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-icon">
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password"></button>
                    </div>
                </div>

                <!-- Recordarme -->
                <div class="form-row">
                    <label class="checkbox-label">
                        <input type="checkbox" name="recordarme">
                        Recordarme
                    </label>
                </div>

                <!-- Botón -->
                <button type="submit" class="btn btn--primary btn--full">
                    Ingresar →
                </button>

                <!-- Olvidé contraseña -->
                <div class="login-form__footer">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>
            </form>

            <!-- Texto inferior -->
            <div class="login-card__bottom">
                <p>Sistema de Control de Asistencia y Nómina</p>
                <span>Acceso Restringido</span>
            </div>

        </div>
    </div>

</body>

</html>
